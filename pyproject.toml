[project]
name = "sybaritic"
version = "0.1.1"
description = "An async-first, fully-typed client library for the Spartan protocol."
readme = "README.md"
authors = [
    { name = "Dave Pearson", email = "davep@davep.org" }
]
requires-python = ">=3.12"
dependencies = []
license = "MIT"
keywords = [
    "API",
    "async",
    "client",
    "library",
    "spartan",
    "gemini",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://sybaritic.davep.dev/"
Repository = "https://github.com/davep/sybaritic"
Documentation = "https://sybaritic.davep.dev/"
Source = "https://github.com/davep/sybaritic"
Issues = "https://github.com/davep/sybaritic/issues"
Discussions = "https://github.com/davep/sybaritic/discussions"

[project.scripts]
sybaritic = "sybaritic.cli:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "codespell>=2.3.0",
    "pre-commit>=4.6.1",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.4",
]

[tool.pyright]
venvPath="."
venv=".venv"
exclude=[".venv"]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.coverage.run]
omit = [
     "tests/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
